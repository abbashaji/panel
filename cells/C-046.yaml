id: C-046
title: Start steward button shows because the launcher member is passed through
type: normal
priority: 15
lease_minutes: 15
goal: |
  Bug found on a real panel: the header shows 'Steward idle, 2 problems' but no 'Start steward' button. Cause: in web/src/core/store.tsx the launcher object that usePanel() returns is built by listing members one by one (start, open, sync, startMany, owner) and startSteward is not copied, so StewardChip always sees launcher.startSteward as undefined and hides Start and Resume.
  Fix:
  - In that useMemo add startSteward: launcherPart.startSteward ?? (() => toast('Launcher not installed. Install it with launcher/install.ps1.', 'error')). Keep the Launcher interface member optional or make it required, whichever keeps current tests compiling.
  - Audit the same object for any other Launcher member that is registered by web/src/launch/index.tsx but not copied, and fix it the same way (list what you checked in the PR text).
  - Add a test in web/src/core/launcher.test.tsx: render PanelProvider, call registerLauncher({ startSteward: fn }), then usePanel().launcher.startSteward() calls fn; without registration it shows the 'Launcher not installed' toast and does not throw.
  - Add one StewardChip test in a NEW file web/src/shell/stewardStart.test.tsx using the real PanelProvider with a mocked getState that returns steward status none: the 'Start steward' button is visible and a click calls the registered startSteward (this is the test that was missing and let the bug through).
inputs: []
after: [C-004, C-012, C-019, C-029, C-031, C-043, C-044, C-045]
supersedes: [C-036, C-040, C-042]
provides:
  - "usePanel().launcher.startSteward always defined"
read:
  - web/src/core/store.tsx
  - web/src/shell/StewardChip.tsx
  - web/src/launch/index.tsx
allowed_paths:
  - web/src/core/store.tsx
  - web/src/core/launcher.test.tsx
  - web/src/shell/stewardStart.test.tsx
outputs:
  - web/src/core/store.tsx
  - web/src/core/launcher.test.tsx
  - web/src/shell/stewardStart.test.tsx
acceptance:
  - cmd: "npm --prefix web test"
  - cmd: "npm --prefix web run build"
notes: |
  Do not change StewardChip.tsx or launch/index.tsx unless the audit proves another bug there; if so tell the owner in the PR text.
