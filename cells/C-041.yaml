  - cmd: "npm --prefix web test"
  - cmd: "npm --prefix web run build"
notes: |
  C-040 is superseded only to avoid a path overlap, its work continues unchanged as C-042. After this merges the owner clears the feedback of C-032 (panel Clear feedback or Release) so a chat can resume it.
