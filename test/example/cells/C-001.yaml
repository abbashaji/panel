id: C-001
title: Configuration loader
goal: |
  Load application settings from a TOML file into a typed object.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      Package `app` lives in src/app/. pytest is configured with pythonpath=src.
provides:
  - "src/app/config.py: @dataclass Config(db_url: str, secret: str)"
  - "src/app/config.py: def load_config(path: str) -> Config  # raises ValueError on missing keys"
allowed_paths:
  - src/app/config.py
  - tests/test_config.py
outputs:
  - src/app/config.py
  - tests/test_config.py
acceptance:
  - cmd: "pytest tests/test_config.py -q"
