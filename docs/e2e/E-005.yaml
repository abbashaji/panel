id: E-005
title: Integration - summary.txt and a line in hello.txt
type: normal
goal: |
  Integration cell. Create e2e-out/summary.txt that lists, one per line, the
  content lines of hello.txt, e2e-out/a.txt, e2e-out/b.txt and e2e-out/c.txt.
  Also append the line: integrated by E-005 to hello.txt.
inputs: []
after:
  - E-001
  - E-002
  - E-003
  - E-004
provides:
  - e2e-out/summary.txt
read:
  - hello.txt
  - e2e-out/a.txt
  - e2e-out/b.txt
  - e2e-out/c.txt
allowed_paths:
  - e2e-out/summary.txt
outputs:
  - e2e-out/summary.txt
acceptance:
  - cmd: test -f e2e-out/summary.txt
  - cmd: grep -q "integrated by E-005" hello.txt
notes: |
  DELIBERATE PATH GAP, for the cell_help then cell_fix test. The goal needs to
  edit hello.txt, but hello.txt is not in allowed_paths. Expected: the worker
  chat asks for help with cell_help instead of writing outside its paths; the
  owner then runs cell_fix to add hello.txt to allowed_paths and outputs.
  This cell also depends on all the others, so it is the integration check.
